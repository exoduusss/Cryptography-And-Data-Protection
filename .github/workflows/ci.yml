name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test-linux:
    name: Ubuntu / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Ruff Check & Format
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy Type Check
        run: |
          mypy week1_feistel week2_double_ratchet week3_paillier_auction

      - name: Bandit Security Audit
        run: |
          bandit -r week1_feistel week2_double_ratchet week3_paillier_auction -x week1_feistel/tests,week2_double_ratchet/tests,week3_paillier_auction/tests

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit

      - name: Pytest with Coverage
        run: |
          pytest --cov=week1_feistel --cov=week2_double_ratchet --cov=week3_paillier_auction --cov-report=xml --cov-report=term-missing --cov-fail-under=85

  test-windows:
    name: Windows / Python 3.11
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Run Pytest
        run: |
          pytest --cov=week1_feistel --cov=week2_double_ratchet --cov=week3_paillier_auction --cov-report=term-missing --cov-fail-under=85
