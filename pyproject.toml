[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptography-secure-systems"
version = "0.1.0"
description = "Three-week applied cryptography portfolio and educational suite"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "cryptography>=42.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.0",
    "pre-commit>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["week1_feistel*", "week2_double_ratchet*", "week3_paillier_auction*"]

[tool.pytest.ini_options]
testpaths = ["week1_feistel/tests", "week2_double_ratchet/tests", "week3_paillier_auction/tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["week1_feistel", "week2_double_ratchet", "week3_paillier_auction"]
omit = ["*/tests/*", "*/examples/*", "*/benchmarks/*"]

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.bandit]
targets = ["week1_feistel", "week2_double_ratchet", "week3_paillier_auction"]
exclude_dirs = ["week1_feistel/tests", "week2_double_ratchet/tests", "week3_paillier_auction/tests", "tests"]
skips = ["B101"]
